apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-image-api
  labels:
    app: api
spec:
  replicas: 2  # Running two copies to utilize your 32GB RAM!
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: async-image-service-api:local
        imagePullPolicy: Never  # Tells K8s to use the image we imported locally
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: api
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30080
